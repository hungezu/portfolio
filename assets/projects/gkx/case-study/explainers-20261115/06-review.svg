<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">从设计规范到交付核对</title><desc id="desc">按页面任务组织规范，分别保留本人署名记录与团队评审意见。 规范用于核对页面；台账保留实际评审意见与原表结论。 结构示意 · 原表未附具体组件、修改前后界面与二次复核材料。</desc><defs><pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#d2e3f0" opacity=".18"/></pattern><linearGradient id="blueFill" x2="0" y2="1"><stop stop-color="#075181"/><stop offset="1" stop-color="#04395f"/></linearGradient><linearGradient id="indigoFill" x2="0" y2="1"><stop stop-color="#243c79"/><stop offset="1" stop-color="#192a58"/></linearGradient><linearGradient id="tealFill" x2="0" y2="1"><stop stop-color="#006a54"/><stop offset="1" stop-color="#005040"/></linearGradient><linearGradient id="windowFill" x2="0" y2="1"><stop stop-color="#3d435e"/><stop offset="1" stop-color="#282d43"/></linearGradient></defs><rect width="1200" height="660" fill="#030405"/><rect width="1200" height="660" fill="url(#dots)"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="48" y="40" font-size="12" fill="#a4b3c0" font-weight="400" text-anchor="start">GKX / 设计说明 06</text><text x="48" y="80" font-size="28" fill="#f2f6fb" font-weight="600" text-anchor="start">从设计规范到交付核对</text><text x="48" y="110" font-size="16" fill="#a4b3c0" font-weight="400" text-anchor="start">按页面任务组织规范，分别保留本人署名记录与团队评审意见。</text><text x="48" y="163" font-size="18" fill="#f2f6fb" font-weight="500" text-anchor="start">规范应用方法</text><rect x="76" y="185" width="218" height="76" rx="5" fill="#151b24" stroke="#44516e" stroke-width="1"/><rect x="66" y="195" width="218" height="76" rx="5" fill="#202b33" stroke="#50616e" stroke-width="1"/><line x1="66" y1="205" x2="66" y2="261" stroke="#4ac5a3" stroke-width="1.3"/><text x="175" y="225" font-size="20" fill="#f2f6fb" font-weight="500" text-anchor="middle">设计规范 / MD</text><line x1="93" y1="244" x2="164" y2="244" stroke="#4ac5a