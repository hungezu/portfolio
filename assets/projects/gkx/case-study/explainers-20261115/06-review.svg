" font-size="16" fill="#a4b3c0" font-weight="400" text-anchor="end">2026/05/21</text><g fill="none" stroke="#8493c4" stroke-width="1"><circle cx="652" cy="398" r="6"/><circle cx="674" cy="398" r="6"/><path d="M642 427 V418 Q652 406 662 418 V427 M665 427 V418 Q675 406 685 418 V427" fill="none" stroke="#44516e" stroke-width="1.5"/></g><text x="702" y="408" font-size="20" fill="#f2f6fb" font-weight="500" text-anchor="start">关系模块</text><text x="702" y="434" font-size="18" fill="#a4b3c0" font-weight="400" text-anchor="start">UI 风格与规范不统一</text><text x="48" y="474" font-size="16" fill="#a4b3c0" font-weight="400" text-anchor="start">个人记录仍缺少的材料</text><rect x="48" y="484" width="160" height="60" rx="5" fill="none" stroke="#50616e" stroke-width="1" stroke-dasharray="5 5"/><rect x="65" y="500" width="30" height="26" rx="5" fill="none" stroke="#50616e" stroke-width="1" stroke-dasharray="5 5"/><rect x="72" y="508" width="16" height="10" rx="5" fill="none" stroke="#50616e" stroke-width="1" stroke-dasharray="5 5"/><text x="113" y="520" font-size="18" fill="#a4b3c0" font-weight="400" text-anchor="start">具体组件</text><rect x="228" y="484" width="160" height="60" rx="5" fill="none" stroke="#50616e" stroke-width="1" stroke-dasharray="5 5"/><rect x="241" y="497" width="16" height="32" rx="5" fill="none" stroke="#50616e" stroke-width="1" stroke-dasharray="5 5"/><rect x="265" y="497" width="16" height="32" rx="5" fill="none" stroke="#50616e" stroke-width="1" stroke-dasharray="5 5"/><line x1="258" y1="513" x2="264" y2="513" stroke="#44516e" stroke-width="1.3" stroke-dasharray="5 5"/><text x="293" y="520" font-size="18" fill="#a4b3c0" font-weight="400" text-anchor="start">修改前后</text><rect x="408" y="484" width="160" height="60" rx="5" fill="none" stroke="#50616e" stroke-width="1" stroke-dasharray="5 5"/><circle cx="440" cy="513" r="15" fill="none" stroke="#50616e" stroke-width="1" stroke-dasharray="4 4"/><path d="M440 502 V513 L448 518" fill="none" stroke="#44516e" stroke-width="1.5" stroke-dasharray="5 5"/><text x="473" y="520" font-size="18" fill="#a4b3c0" font-weight="400" text-anchor="start">二次复核</text><rect x="628" y="485" width="8" height="8" fill="#f4ab63" transform="rotate(45 632 489)"/><text x="651" y="496" font-size="18" fill="#a4b3c0" font-weight="400" text-anchor="start">署名记录支持评审参与；</text><text x="651" y="528" font-size="18" fill="#a4b3c0" font-weight="400" text-anchor="start">具体整改与复核过程仍待补证。</text><line x1="48" y1="576" x2="1152" y2="576" stroke="#2b3b46" stroke-width="1.3"/><text x="48" y="610" font-size="20" fill="#f2f6fb" font-weight="500" text-anchor="start">规范用于核对页面；台账保留实际评审意见与原表结论。</text><text x="48" y="640" font-size="14" fill="#a4b3c0" font-weight="400" text-anchor="start">结构示意 · 原表未附具体组件、修改前后界面与二次复核材料。</text></g></svg>