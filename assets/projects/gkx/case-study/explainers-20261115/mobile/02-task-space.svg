<title id="02-task-space-title">按任务分配空间：单条维护与节点建模</title><desc id="02-task-space-desc">手机版图稿意图示意：短时单条维护使用同页弹窗，关闭后继续来源列表；节点建模从流程对象列表进入独立画布与节点属性工作区。保存用于保留本次编辑，保存并发布用于使流程生效。未保存提示、发布反馈及返回后的列表状态仍待实现核对，不代表已实现完整业务闭环。</desc>
