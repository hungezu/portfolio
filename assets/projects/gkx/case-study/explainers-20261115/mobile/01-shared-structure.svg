<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1340" viewBox="0 0 360 1340" role="img" aria-labelledby="01-shared-structure-title 01-shared-structure-desc" xml:lang="zh-CN">
<title id="01-shared-structure-title">共用操作，页面骨架随任务变化</title><desc id="01-shared-structure-desc">手机版结构示意：共用查询入口、选择反馈、返回路径和操作反馈，通过同一主干连接四种任务骨架：候选资源卡片、同一领域内容、对象列表及节点画布。MaaS 模型广场应用共用操作规范。</desc>
<defs>
<pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#d2e3f0" opacity=".18"/></pattern>
<linearGradient id="blueFill" x2="0" y2="1"><stop stop-color="#075181"/><stop offset="1" stop-color="#04395f"/></linearGradient>
<linearGradient id="tealFill" x2="0" y2="1"><stop stop-color="#006a54"/><stop offset="1" stop-color="#005040"/></linearGradient>
<linearGradient id="windowFill" x2="0" y2="1"><stop stop-color="#3d435e"/><stop offset="1" stop-color="#282d43"/></linearGradient>
</defs>
<rect width="360" height="1340" fill="#030405"/><rect width="360" height="1340" fill="url(#dots)"/>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="20" y="28" font-size="14" fill="#a4b3c0" font-weight="400" text-anchor="start">GKX / 设计说明 01</text><text x="20" y="64" font-size="24" fill="#f2f6fb" font-weight="600" text-anchor="start">共用操作，</text><text x="20" y="96" font-size="24" fill="#f2f6fb" font-weight="600" text-anchor="start">页面骨架随任务变化</text><text x="20" y="122" font-size="14" fill="#a4b3c0" font-weight="400" text-anchor="start">查询、反馈与返回沿用共同规则；</text><text x="20" y="143" font-size="14" fill="#a4b3c0" font-weight="400" text-anchor="start">内容组织由业务任务决定。</text><rect x="20" y="166" width="320" height="112" rx="7" fill="url(#tealFill)" stroke="#258771" stroke-width="1" /><text x="36" y="194" font-size="18" fill="#f2f6fb" font-weight="500" text-anchor="start">共用操作</text><text x="52" y="224" font-size="16" fill="#f2f6fb" font-weight="400" text-anchor="start">查询入口</text><text x="202" y="224" font-size="16" fill="#f2f6fb" font-weight="400" text-anchor="start">选择反馈</text><text x="52" y="252" font-size="16" fill="#f2f6fb" font-weight="400" text-anchor="start">返回路径</text><text x="202" y="252" font-size="16" fill="#f2f6fb" font-weight="400" text-anchor="start">操作反馈</text><path d="M180 278V294H20V972" fill="none" stroke="#438b80" stroke-width="1.5"/><line x1="20" y1="312" x2="42" y2="312" stroke="#438b80" stroke-width="1.3"/><path d="M34 315.5L42 312L34 308.5" fill="none" stroke="#438b80" stroke-width="1.5"/><text x="52" y="318" font-size="18" fill="#f2f6fb" font-weight="500" text-anchor="start">资源发现</text><rect x="52" y="338" width="288" height="150" rx="6" fill="#141925" stroke="#586077" stroke-width="1" /><rect x="53" y="339" width="286" height="25" rx="5" fill="url(#windowFill)" stroke="none" stroke-width="1" /><rect x="62" y="348" width="80" height="6" rx="0" fill="#7884ae" stroke="none" stroke-width="1" /><rect x="307" y="347" width="9" height="7" rx="3" fill="#7884ae" stroke="none" stroke-width="1" /><rect x="321" y="347" width="9" height="7" rx="3" fill="#7884ae" stroke="none" stroke-width="1" /><rect x="64" y="374" width="82.66666666666667" height="30" rx="4" fill="#202b33" stroke="#346b9d" stroke-width="1" /><text x="105.33333333333334" y="395" font-size="16" fill="#f2f6fb" font-weight="400" text-anchor="middle">类别</text><rect x="154.66666666666669" y="374" width="82.66666666666667" height="30" rx="4" fill="#202b33" stroke="#346b9d" stroke-width="1" /><text x="196.00000000000003" y="395" font-size="16" fill="#f2f6fb" font-weight="400" text-anchor="middle">能力</text><rect x="245.33333333333334" y="374" width="82.66666666666667" height="30" rx="4" fill="#202b33" stroke="#346b9d" stroke-width="1" /><text x="286.6666666666667" y="395" font-size="16" fill="#f2f6fb" font-weight="400" text-anchor="middle">厂商</text><rect x="64" y="416" width="126" height="59" rx="4" fill="#1d2536" stroke="#45536e" stroke-width="1" /><rect x="74" y="427" width="96" height="7" rx="0" fill="#8a97c2" stroke="none" stroke-width="1" /><rect x="74" y="442" width="104" height="5" rx="0" fill="#515f83" stroke="none" stroke-width="1" /><text x="74" y="465" font-size="14" fill="#4ac5a3" font-weight="400" text-anchor="start">状态</text><rect x="112" y="458" width="66" height="5" rx="1" fill="#3f8d7c" stroke="none" stroke-width="1" /><rect x="202" y="416" width="126" height="59" rx="4" fill="#1d2536" stroke="#45536e" stroke-width="1" /><rect x="212" y="427" width="96" height="7" rx="0" fill="#8a97c2" stroke="none" stroke-width="1" /><rect x="212" y="442" width="104" height="5" rx="0" fill="#515f83" stroke="none" stroke-width="1" /><text x="212" y="465" font-size="14" fill="#4ac5a3" font-weight="400" text-anchor="start">状态</text><rect x="250" y="458" width="66" height="5" rx="1" fill="#3f8d7c" stroke="none" stroke-width="1" /><text x="52" y="504" font-size="16" fill="#a4b3c0" font-weight="400" text-anchor="start">候选卡片 · 比较模型</text><line x1="20" y1="532" x2="42" y2="532" stroke="#438b80" stroke-width="1.3"/><path d="M34 535.5L42 532L34 528.5" fill="none" stroke="#438b80" stroke-width="1.5"/><text x="52" y="538" font-size="18" fill="#f2f6fb" font-weight="500" text-anchor="start">领域分析</text><rect x="52" y="558" width="288" height="150" rx="6" fill="#141925" stroke="#586077" stroke-width="1" /><rect x="53" y="559" width="286" height="25" rx="5" fill="url(#windowFill)" stroke="none" stroke-width="1" /><rect x="62" y="568" width="80" height="6" rx="0" fill="#7884ae" stroke="none" stroke-width="1" /><rect x="307" y="567" width="9" height="7" rx="3" fill="#7884ae" stroke="none" stroke-width="1" /><rect x="321" y="567" width="9" height="7" rx="3" fill="#7884ae" stroke="none" stroke-width="1" /><rect x="64" y="594" width="264" height="28" rx="3" fill="#233754" stroke="#426993" stroke-width="1" /><text x="76" y="614" font-size="16" fill="#f2f6fb" font-weight="400" text-anchor="start">当前分析领域</text><rect x="64" y="634" width="176" height="61" rx="3" fill="#20283b" stroke="#414d69" stroke-width="1" /><text x="76" y="657" font-size="16" fill="#a4b3c0" font-weight="400" text-anchor="start">技术趋势</text><path d="M76 684L101 676L126 681L155 668L217 664" fill="none" stroke="#8f9fcf" stroke-width="1.5"/><rect x="252" y="634" width="76" height="26" rx="3" fill="#20283b" stroke="#414d69" stroke-width="1" /><text x="290" y="653" font-size="16" fill="#a4b3c0" font-weight="400" text-anchor="middle">报告</text><rect x="252" y="669" width="76" height="26" rx="3" fill="#20283b" stroke="#414d69" stroke-width="1" /><text x="290" y="688" font-size="16" fill="#a4b3c0" font-weight="400" text-anchor="middle">人才</text><text x="52" y="724" font-size="16" fill="#a4b3c0" font-weight="400" text-anchor="start">领域内容 · 保持对象</text><line x1="20" y1="752" x2="42" y2="752" stroke="#438b80" stroke-width="1.3"/><path d="M34 755.5L42 752L34 748.5" fill="none" stroke="#438b80" stroke-width="1.5"/><text x="52" y="758" font-size="18" fill="#f2f6fb" font-weight="500" text-anchor="start">对象维护</text><rect x="52" y="778" width="288" height="150" rx=