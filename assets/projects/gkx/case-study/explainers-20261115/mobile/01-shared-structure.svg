fb" font-weight="500" text-anchor="start">节点建模</text><rect x="52" y="998" width="288" height="150" rx="6" fill="#141925" stroke="#586077" stroke-width="1" /><rect x="53" y="999" width="286" height="25" rx="5" fill="url(#windowFill)" stroke="none" stroke-width="1" /><rect x="62" y="1008" width="80" height="6" rx="0" fill="#7884ae" stroke="none" stroke-width="1" /><rect x="307" y="1007" width="9" height="7" rx="3" fill="#7884ae" stroke="none" stroke-width="1" /><rect x="321" y="1007" width="9" height="7" rx="3" fill="#7884ae" stroke="none" stroke-width="1" /><rect x="258" y="1034" width="70" height="101" rx="3" fill="#20283b" stroke="#414d69" stroke-width="1" /><text x="293" y="1057" font-size="16" fill="#a4b3c0" font-weight="400" text-anchor="middle">属性</text><rect x="268" y="1074" width="50" height="6" rx="0" fill="#515f83" stroke="none" stroke-width="1" /><rect x="268" y="1094" width="50" height="6" rx="0" fill="#515f83" stroke="none" stroke-width="1" /><rect x="268" y="1114" width="50" height="6" rx="0" fill="#515f83" stroke="none" stroke-width="1" /><line x1="108" y1="1091" x2="118" y2="1091" stroke="#7d8cb9" stroke-width="1.3"/><path d="M110 1094.5L118 1091L110 1087.5" fill="none" stroke="#7d8cb9" stroke-width="1.5"/><rect x="64" y="1074" width="44" height="34" rx="3" fill="#233754" stroke="#4b77a1" stroke-width="1" /><text x="86" y="1097" font-size="18" fill="#f2f6fb" font-weight="400" text-anchor="middle">A</text><line x1="164" y1="1091" x2="174" y2="1091" stroke="#7d8cb9" stroke-width="1.3"/><path d="M166 1094.5L174 1091L166 1087.5" fill="none" stroke="#7d8cb9" stroke-width="1.5"/><rect x="120" y="1074" width="44" height="34" rx="3" fill="#233754" stroke="#4b77a1" stroke-width="1" /><text x="142" y="1097" font-size="18" fill="#f2f6fb" font-weight="400" text-anchor="middle">B</text><rect x="176" y="1074" width="44" height="34" rx="3" fill="#233754" stroke="#4b77a1" stroke-width="1" /><text x="198" y="1097" font-size="18" fill="#f2f6fb" font-weight="400" text-anchor="middle">C</text><text x="142" y="1132" font-size="16" fill="#a4b3c0" font-weight="400" text-anchor="middle">节点关系</text><text x="52" y="1164" font-size="16" fill="#a4b3c0" font-weight="400" text-anchor="start">关系画布 · 配置节点</text><line x1="20" y1="1206" x2="340" y2="1206" stroke="#2b3b46" stroke-width="1.3"/><text x="20" y="1236" font-size="18" fill="#f2f6fb" font-weight="400" text-anchor="start">共用的是操作关系，</text><text x="20" y="1262" font-size="18" fill="#f2f6fb" font-weight="400" text-anchor="start">变化的是业务组织。</text><text x="20" y="1296" font-size="14" fill="#a4b3c0" font-weight="400" text-anchor="start">结构示意 · MaaS 模型广场，</text><text x="20" y="1317" font-size="14" fill="#a4b3c0" font-weight="400" text-anchor="start">应用共用操作规范。</text></g>
</svg>
