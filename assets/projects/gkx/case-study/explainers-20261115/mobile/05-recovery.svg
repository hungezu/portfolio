<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1092" viewBox="0 0 360 1092" role="img" aria-labelledby="title desc"><title id="title">导入失败：从问题定位到继续处理</title><desc id="desc">失败提示、错误行定位、修正源文件、重新上传四步反馈路径。图稿已有错误定位与重传入口，完整恢复流程仍待核对，不表示已经验收。</desc><defs><pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#d2e3f0" opacity=".18"/></pattern><linearGradient id="blueFill" x2="0" y2="1"><stop stop-color="#075181"/><stop offset="1" stop-color="#04395f"/></linearGradient><linearGradient id="tealFill" x2="0" y2="1"><stop stop-color="#006a54"/><stop offset="1" stop-color="#005040"/></linearGradient><linearGradient id="windowFill" x2="0" y2="1"><stop stop-color="#3d435e"/><stop offset="1" stop-color="#282d43"/></linearGradient></defs><rect width="360" height="1092" fill="#030405"/><rect width="360" height="1092" fill="url(#dots)"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="24" y="28" font-size="14" fill="#a4b3c0" font-weight="400" text-anchor="start">GKX / 设计说明 05</text><text x="24" y="68" font-size="24" fill="#f2f6fb" font-weight="600" text-anchor="start">导入失败</text><text x="24" y="98" font-size="20" fill="#f2f6fb" font-weight="500" text-anchor="start">从问题定位到继续处理</text><text x="24" y="126" font-size="14" fill="#a4b3c0" font-weight="400" text-anchor="start">指出问题位置，保留重传入口。</text><text x="24" y="165" font-size="18" fill="#f2f6fb" font-weight="500" text-anchor="start">01 失败提示</text><rect x="24" y="181" width="312" height="138" rx="6" fill="#141925" stroke="#586077" stroke-width="1"/><rect x="25" y="182" width="310" height="25" rx="5" fill="url(#windowFill)" stroke="none" stroke-width="1"/><rect x="34" y="191" width="80" height="6" rx="0" fill="#7884ae" stroke="none" stroke-width="1"/><rect x="303" y="190" width="9" height="7" rx="3" fill="#7884ae" stroke="none" stroke-width="1"/><rect x="317" y="190" width="9" height="7" rx="3" fill="#7884ae" stroke="none" stroke-width="1"/><rec