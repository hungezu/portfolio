516e" stroke-width="1.3"/><rect x="124" y="875" width="190" height="34" rx="4" fill="url(#blueFill)" stroke="#346b9d" stroke-width="1"/><text x="219" y="899" font-size="18" fill="#f2f6fb" font-weight="400" text-anchor="middle">重新上传</text><text x="124" y="935" font-size="16" fill="#a4b3c0" font-weight="400" text-anchor="start">有明确的继续入口</text><rect x="24" y="982" width="8" height="8" fill="#f4ab63" transform="rotate(45 28 986)"/><text x="44" y="992" font-size="16" fill="#a4b3c0" font-weight="400" text-anchor="start">完整恢复流程仍待核对。</text><line x1="24" y1="1014" x2="336" y2="1014" stroke="#2b3b46" stroke-width="1.3"/><text x="24" y="1042" font-size="16" fill="#f2f6fb" font-weight="500" text-anchor="start">定位问题 → 修正文件 → 重新上传</text><text x="24" y="1071" font-size="14" fill="#a4b3c0" font-weight="400" text-anchor="start">结构示意，不表示恢复流程已经验收。</text></g></svg>