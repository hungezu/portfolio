<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1224" viewBox="0 0 360 1224" role="img" aria-labelledby="title desc"><title id="title">从设计规范到交付核对</title><desc id="desc">设计规范和 MD 按页面任务组织核对点。本人署名历史记录：2026/10/08，原表第15行，基础数据管理，原表最终通过，意见为微调即可、组件样式调整。另列非本人署名的团队意见：2026/05/21，关系模块 UI 风格与规范不统一。具体组件、修改前后、二次复核材料仍缺少；署名记录支持评审参与，具体整改与复核过程仍待补证。</desc><defs><pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#d2e3f0" opacity=".18"/></pattern><linearGradient id="blueFill" x2="0" y2="1"><stop stop-color="#075181"/><stop offset="1" stop-color="#04395f"/></linearGradient><linearGradient id="tealFill" x2="0" y2="1"><stop stop-color="#006a54"/><stop offset="1" stop-color="#005040"/></linearGradient><linearGradient id="windowFill" x2="0" y2="1"><stop stop-color="#3d435e"/><stop offset="1" stop-color="#282d43"/></linearGradient></defs><rect width="360" height="1224" fill="#030405"/><rect width="360" height="1224" fill="url(#dots)"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="24" y="28" font-size="14" fill="#a4b3c0" font-weight="400" text-anchor="start">GKX / 设计说明 06</text><text x="24" y="68" font-size="24" fill="#f2f6fb" font-weight="600" text-anchor="start">从设计规范到交付核对</text><text x="24" y="98" font-size="14" fill="#a4b3c0" font-weight="400" text-anchor="start">按页面任务组织规范，分别保留</text><text x="24" y="120" font-size="14" fill="#a4b3c0" font-weight="400" text-anchor="start">本人署名记录与团队评审意见。</text><text x="24" y="158" font-size="18" fill="#f2f6fb" font-weight="500" text-anchor="start">规范应用方法</text><rect x="55" y="170" width="264" height="58" rx="5" fill="#151b24" stroke="#44516e" stroke-width="1"/><rect x="48" y="180" width="264" height="58" rx="5" fill="#202b33" stroke="#50616e" stroke-width="1"/><line x1="48" y1="190" x2="48" y2="226" stroke="#4ac5a3" stroke-width="1.3"/><text x="180" y="215" font-size="20" fill="#f2f6fb" font-weight="500" text-anchor="middle">设计规范 / MD</text><line x1="180" y1="249" x2="180" y2="263" stroke="#4b9ae9" stroke-width="1.3"/><path d="M176 254 L180 263 L184 254" fill="none" stroke="#4b9ae9" stroke-width="1.5"/><rect x="48" y="273" width="264" height="68" rx="6" fill="#141925" stroke="#586077" stroke-width="1"/><rect x="49" y="274" width="262" height="25" rx="5" fill="url(#windowFill)" stroke="none" stroke-width="1"/><rect x="58" y="283" width="79.2" height="6" rx="0" fill="#7884ae" stroke="none" stroke-width="1"/><rect x="279" y="282" width="9" height="7" rx="3" fill="#7884ae" stroke="none" stroke-width="1"/><rect x="293" y="282" width="9" height="7" rx="3" fill="#7884ae" stroke="none" stroke-width="1"/><rect x="63" y="310" width="57" height="20" rx="2" fill="#18253b" stroke="#44516e" stroke-width="1"/><line x1="72" y1="317" x2="110" y2="317" stroke="#8493c4" stroke-width="1.3"/><line x1="72" y1="324" x2="99" y2="324" stroke="#44516e" stroke-width="1.3"/><text x="218" y="326" font-size="20" fill="#f2f6fb" font-weight="500" text-anchor="middle">页面任务</text><line x1="180" y1="351" x2="180" y2="367" stroke="#4b9ae9" stroke-width="1.3"/><path d="M176 358 L180 367 L184 358" fill="none" stroke="#4b9ae9" stroke-width="1.5"/><rect x="48" y="379" width="264" height="58" rx="6" fill="#202b33" stroke="#50616e" stroke-width="1"/><rect x="66" y="392" width="12" height="12" rx="1" fill="none" stroke="#4ac5a3" stroke-width="1"/><line x1="87" y1="398" x2="115" y2="398" stroke="#44516e" stroke-width="1.3"/><rect x="66" y="413" width="12" height="12" rx="1" fill="none" stroke="#4ac5a3" stroke-width="1"/><line x1="87" y1="419" x2="115" y2="419" stroke="#44516e" stroke-width="1.3"/><text x="218" y="415" font-size="20" fill="#f2f6fb" font-weight="500" text-anchor="middle">核对点</text><line x1="24" y1="458" x2="336" y2="458" stroke="#2b3b46" stroke-width="1.3"/><text x="24" y="480" font-size="18" fill="#f2f6fb" font-weight="500" text-anchor="start">本人署名的历史记录</text><rect x="24" y="496" width="312" height="164" rx="6" fill="#141925" stroke="#586077" stroke-width="1"/><rect x="25" y="497" width="310" height="25" rx="5" fill="url(#windowFill)" stroke="none" stroke-width="1"/><rect x="34" y="506" width="80" height="6" rx="0" fill="#7884ae" stroke="none" stroke-width="1"/><rect x="303" y="505" width="9" height="7" rx="3" fill="#7884ae" stroke="none" stroke-width="1"/><rect x="317" y="505" width="9" height="7" rx="3" fill="#7884ae" stroke="none" stroke-width="1"/><text x="40" y="545" font-size="18" fill="#f2f6fb" font-weight="500" text-anchor="start">原表第 15 行</text><text x="320" y="545" font-size="14" fill="#a4b3c0" font-weight="400" text-anchor="end">2026/10/08</text><rect x="40" y="557" width="280" height="31" rx="3" fill="#142c45" stroke="#4b9ae9" stroke-width="1"/><text x="52" y="579" font-size="18" fill="#f2f6fb" font-weight="500" text-anchor="start">基础数据管理</text><text x="308" y="579" font-size="16" fill="#f2f6fb" font-weight="400" text-anchor="end">原表最终：通过</text><text x="40" y="613" font-size="16" fill="#a4b3c0" font-weight="400" text-anchor="start">意见：微调即可，</text><text x="40" y="640" font-size="16" fill="#a4b3c0" font-weight="400" text-anchor="start">组件样式调整</text><text x="24" y="696" font-size="18" fill="#f2f6fb" font-weight="500" text-anchor="start">团队意见（非本人署名）</text><rect x="24" y="713" width="312" height="140" rx="6" fill="#141925" stroke="#586077" stroke-width="1"/><rect x="25" y="714" width="310" height="25" rx="5" fill="url(#windowFill)" stroke="none" stroke-width="1"/><rect x="34" y="723" width="80" height="6" rx="0" fill="#7884ae" stroke="none" stroke-width="1"/><rect x="303" y="722" width="9" height="7" rx="3" fill="#7884ae" stroke="none" stroke-width="1"/><rect x="317" y="722" width="9" height="7" rx="3" fill="#7884ae" stroke="none" stroke-width="1"/><text x="40" y="758" font-size="14" fill="#a4b3c0" font-weight="400" text-anchor="start">2026/05/21</text><g fill="none" stroke="#8493c4" stroke-width="1"><circle cx="50" cy="783" r="6"/><circle cx="72" cy="783" r="6"/></g><path d="M40 812 V803 Q50 791 60 803 V812 M62 812 V803 Q72 791 82 803 V812" fill="none" stroke="#44516e" stroke-width="1.5"/><text x="94" y="786" font-size="18" fill="#f2f6fb" font-weight="500" text-anchor="start">关系模块</text><text x="94" y="818" font-size="16" fill="#a4b3c0" font-weight="400" text-anchor="start">UI 风格与规范不统一</text><text x="24" y="890" font-size="18" fill="#f2f6fb" font-weight="500" text-anchor="start">个人记录仍缺少的材料</text><rect x="24" y="906" width="96" height="96" rx="5" fill="none" stroke="#50616e" stroke-width="1" stroke-dasharray="5 5"/><rect x="55" y="923" width="34" height="28" rx="5" fill="none" stroke="#50616e" stroke-width="1" stroke-dasharray="5 5"/><rect x="63" y="932" width="18" height="10" rx="5" fill="none" stroke="#50616e" stroke-width="1" stroke-dasharray="5 5"/><text x="72" y="985" font-size="18" fill="#a4b3c0" font-weight="400" text-anchor="middle">具体组件</text><rect x="132" y="906" width="96" height="96" rx="5" fill="none" stroke="#50616e" stroke-width="1" stroke-dasharray="5 5"/><rect x="159" y="919" width="17" height="37" rx="5" fill="none" stroke="#50616e" stroke-width="1" stroke-dasharray="5 5"/><rect x="184" y="919" width="17" height="37" rx="5" fill="none" stroke="#50616e" stroke-width="1" stroke-dasharray="5 5"/><line x1="177" y1="937" x2="183" y2="937" stroke="#44516e" stroke-width="1.3" stroke-dasharray="5 5"/><text x="180" y="985" font-size="18" fill="#a4b3c0" font-weight="400" text-anchor="middle">修改前后</text><rect x="240" y="906" width="96" height="96" rx="5" fill="none" stroke="#50616e" stroke-width="1" stroke-dasharray="5 5"/><circle cx="288" cy="938" r="18" fill="none" stroke="#50616e" stroke-width="1" stroke-dasharray="4 4"/><path d="M288 926 V938 L298 944" fill="none" stroke="#44516e" stroke-width="1.5" stroke-dasharray="5 5"/><text x="288" y="985" font-size="18" fill="#a4b3c0" font-weight="400" text-anchor="middle">二次复核</text><rect x="24" y="1030" width="8" height="8" fill="#f4ab63" transform="rotate(45 28 1034)"/><text x="44" y="1040" font-size="16" fill="#a4b3c0" font-weight="400" text-anchor="start">署名记录支持评审参与；</text><text x="44" y="1065" font-size="16" fill="#a4b3c0" font-weight="400" text-anchor="start">具体整改与复核过程仍待补证。</text><line x1="24" y1="1090" x2="336" y2="1090" stroke="#2b3b46" stroke-width="1.3"/><text x="24" y="1119" font-size="18" fill="#f2f6fb" font-weight="500" text-anchor="start">规范用于核对页面；</text><text x="24" y="1146" font-size="16" fill="#f2f6fb" font-weight="500" text-anchor="start">台账保留实际评审意见与原表结论。</text><text x="24" y="1178" font-size="14" fill="#a4b3c0" font-weight="400" text-anchor="start">结构示意 · 原表未附具体组件、</text><text x="24" y="1200" font-size="14" fill="#a4b3c0" font-weight="400" text-anchor="start">修改前后界面与二次复核材料。</text></g></svg>