    <script>
      (() => {
        try {
          const seen = sessionStorage.getItem("leo-portfolio-loader-seen") === "1";
          document.documentElement.classList.add(
            seen ? "portfolio-loader-seen" : "portfolio-loading",
          );
        } catch {
          document.documentElement.classList.add("portfolio-loading");
        }
      })();
    </script>
    <style>
      html.portfolio-loading { overflow: hidden; }
      html.portfolio-loader-seen .portfolio-boot { display: none; }
      .portfolio-boot {
        position: fixed;
        z-index: 100000;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fff;
        color: #111;
        font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
        opacity: 1;
        transition: opacity 560ms cubic-bezier(.16, 1, .3, 1);
      }
      .portfolio-boot.is-complete {
        opacity: 0;
        pointer-events: none;
      }
      .portfolio-boot__content {
        display: grid;
        width: min(160px, 100%);
        min-height: 70px;
        place-items: center;
        justify-items: center;
      }
      .portfolio-boot__progress {
        display: grid;
        grid-area: 1 / 1;
        justify-items: center;
        opacity: 1;
        transform: translateY(0) scale(1);
        transition:
          opacity 340ms cubic-bezier(.16, 1, .3, 1),
          transform 420ms cubic-bezier(.16, 1, .3, 1);
      }
      .portfolio-boot__progress[hidden] { display: none; }
      .portfolio-boot__progress.is-leaving {
        opacity: 0;
        transform: translateY(-6px) scale(.98);
      }
      .portfolio-boot__progress.is-ready .portfolio-boot__value {
        animation: portfolio-boot-ready 420ms cubic-bezier(.16, 1, .3, 1) both;
      }
      .portfolio-boot__value {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        font-size: clamp(38px, 5vw, 46px);
        font-variant-numeric: tabular-nums;
        font-weight: 400;
        letter-spacing: -.035em;
        line-height: .9;
      }
      .portfolio-boot__value small {
        margin: .04em 0 0 .1em;
        font-size: .28em;
        font-weight: 500;
        letter-spacing: 0;
      }
      .portfolio-boot__welcome {
        grid-area: 1 / 1;
        color: #111;
        font-size: clamp(20px, 3vw, 26px);
        font-weight: 500;
        letter-spacing: .16em;
        line-height: 1;
        opacity: 0;
        transform: translateY(7px);
        transition:
          opacity 420ms cubic-bezier(.16, 1, .3, 1),
          transform 500ms cubic-bezier(.16, 1, .3, 1);
      }
      .portfolio-boot__welcome.is-visible {
        opacity: 1;
        transform: translateY(0);
      }
      @keyframes portfolio-boot-ready {
        0%, 100% { opacity: 1; transform: scale(1); }
        42% { opacity: .34; transform: scale(.975); }
        72% { opacity: 1; transform: scale(1.025); }
      }
      #root {
        opacity: 1;
        transition:
          opacity 620ms cubic-bezier(.16, 1, .3, 1),
          transform 760ms cubic-bezier(.16, 1, .3, 1);
      }
      html.portfolio-loading #root {
        opacity: 0;
        transform: translateY(10px);
      }
      @media (max-width: 560px) {
        .portfolio-boot { padding: 20px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .portfolio-boot.is-complete { transition-duration: 80ms; }
        .portfolio-boot__progress { transition: none; }
        .portfolio-boot__value { animation: none !important; }
        .portfolio-boot__welcome { transition: none; }
        #root { transition: none; transform: none; }
      }
    </style>

  <body>
    <div class="portfolio-boot" id="portfolio-boot" role="status" aria-live="polite" aria-label="作品集加载中">
      <div class="portfolio-boot__content">
        <div class="portfolio-boot__progress" id="portfolio-boot-progress">
          <div class="portfolio-boot__value" aria-hidden="true"><span id="portfolio-boot-value">00</span><small>%</small></div>
        </div>
        <div class="portfolio-boot__welcome" id="portfolio-boot-welcome" hidden>WELCOME</div>
      </div>
    </div>
    <script>
      (() => {
        const loader = document.getElementById("portfolio-boot");
        if (!loader || document.documentElement.classList.contains("portfolio-loader-seen")) {
          loader?.remove();
          return;
        }

        const valueNode = document.getElementById("portfolio-boot-value");
        const progressNode = document.getElementById("portfolio-boot-progress");
        const welcomeNode = document.getElementById("portfolio-boot-welcome");
        const startedAt = performance.now();
        const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
        let criticalContentReady = false;
        let value = 0;
        let finished = false;
        let rootObserver;
        let stopWaitingForContent = () => {};

        const markLoaded = () => {
          criticalContentReady = true;
          stopWaitingForContent();
        };
        window.setTimeout(markLoaded, 8000);

        const waitForCriticalContent = (root) => {
          let fontsReady = false;
          let completing = false;
          const decodedSources = new WeakMap();
          const decodingSources = new WeakMap();
          const resourceEvents = ["load", "error", "loadeddata", "canplay"];
          const scheduleCheck = () => requestAnimationFrame(check);
          const observer = new MutationObserver(scheduleCheck);

          const imageIsReady = (image, allowFailure) => {
            if (!image.complete) return false;
            if (image.naturalWidth === 0) return allowFailure;
            const source = image.currentSrc || image.src;
            if (typeof image.decode !== "function" || decodedSources.get(image) === source) return true;
            if (decodingSources.get(image) !== source) {
              decodingSources.set(image, source);
              image.decode().catch(() => {}).then(() => {
                if ((image.currentSrc || image.src) === source) decodedSources.set(image, source);
                scheduleCheck();
              });
            }
            return false;
          };

          function check() {
            if (finished || criticalContentReady || completing) return;
            const hero = root.querySelector(".hero");
            const project = root.querySelector("main[data-project]");
            const notFound = root.querySelector(".not-found");
            const image = hero
              ? hero.querySelector(".hero-poster img")
              : project?.querySelector('img[loading="eager"], img[fetchpriority="high"]');
            // A lazy case module may still be mounting; wait for its first eager
            // image instead of treating the initial Suspense fallback as ready.
            const imageReady = image
              ? imageIsReady(image, Boolean(hero))
              : Boolean(notFound || (project && !project.querySelector(".case-loading") && project.querySelector(".image-fallback")));
            const video = hero?.querySelector("video");
            const videoState = video?.dataset.preloadState;
            const videoReady = hero
              ? Boolean(video && (["disabled", "ready", "error"].includes(videoState) || (videoState === "loading" && video.readyState >= 2)))
              : Boolean(project || notFound);
            const capabilityState = hero ? root.querySelector("[data-ability-visual]")?.dataset.renderer : undefined;
            const capabilityReady = !hero || ["ready", "unavailable"].includes(capabilityState);

            // "pending" keeps the loader up until Hero has decided whether it
            // should load motion, even before React attaches its video sources.
            if (!fontsReady || !imageReady || !videoReady || !capabilityReady) return;
            completing = true;
            requestAnimationFrame(() => requestAnimationFrame(markLoaded));
          }

          stopWaitingForContent = () => {
            observer.disconnect();
            resourceEvents.forEach(event => root.removeEventListener(event, scheduleCheck, true));
          };
          observer.observe(root, {
            childList: true,
            subtree: true,
            attributes: true,
            attributeFilter: ["data-preload-state", "data-renderer", "src", "srcset", "loading", "fetchpriority"],
          });
          resourceEvents.forEach(event => root.addEventListener(event, scheduleCheck, true));
          (document.fonts?.ready?.catch(() => {}) ?? Promise.resolve()).then(() => {
            fontsReady = true;
            check();
          });
          check();
        };

        const watchApp = () => {
          const root = document.getElementById("root");
          if (!root) {
            requestAnimationFrame(watchApp);
            return;
          }
          if (root.childElementCount > 0) {
            waitForCriticalContent(root);
            return;
          }
          rootObserver = new MutationObserver(() => {
            if (root.childElementCount === 0) return;
            rootObserver.disconnect();
            waitForCriticalContent(root);
          });
          rootObserver.observe(root, { childList: true });
        };
        requestAnimationFrame(watchApp);

        const finish = () => {
          if (finished) return;
          finished = true;
          rootObserver?.disconnect();
          stopWaitingForContent();
          try { sessionStorage.setItem("leo-portfolio-loader-seen", "1"); } catch {}
          window.setTimeout(() => {
            progressNode.classList.remove("is-ready");
            progressNode.classList.add("is-leaving");
            welcomeNode.hidden = false;
            requestAnimationFrame(() => welcomeNode.classList.add("is-visible"));
            window.setTimeout(() => { progressNode.hidden = true; }, reducedMotion ? 0 : 320);
            window.setTimeout(() => {
              document.documentElement.classList.remove("portfolio-loading");
              loader.classList.add("is-complete");
              window.setTimeout(() => {
                document.documentElement.classList.add("portfolio-loader-seen");
                loader.remove();
              }, reducedMotion ? 90 : 450);
            }, reducedMotion ? 100 : 500);
          }, reducedMotion ? 80 : 440);
          progressNode.classList.add("is-ready");
        };

        const render = (now) => {
          const elapsed = now - startedAt;
          const waitingTarget = Math.min(99, Math.floor(99 * (1 - Math.exp(-elapsed / 1450))));
          const target = criticalContentReady && elapsed >= (reducedMotion ? 120 : 1350)
            ? 100
            : waitingTarget;
          const step = target === 100
            ? Math.max(1, Math.ceil((target - value) * .14))
            : Math.max(1, Math.ceil((target - value) * .08));
          value = Math.min(target, value + step);
          valueNode.textContent = String(value).padStart(2, "0");

          if (value >= 100) finish();
          else requestAnimationFrame(render);
        };

        requestAnimationFrame(render);
      })();
    </script>
    <div id="root"></div>
    <script defer src="/portfolio/pet-drag-fallback.js"></script>
  </body>
